name: verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/backend/requirements.txt pytest
          python scripts/windows/check_dependencies.py

      - name: Install Korean fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f

      - name: Run tests
        env:
          PYTHONPATH: src/backend:src/agent
        run: python -m pytest -q tests eval/table-discovery/v4.1/tests

      - name: Verify 349-table planning and existing agent flows
        run: |
          PYTHONPATH=src/backend:src/agent python -m pytest -q tests/test_349_tables.py tests/test_jev_hybrid.py tests/test_clarify_regression.py tests/test_langgraph_flow.py tests/test_output_agent.py
          python tests/TEST_AGENT_FLOW.py

      - name: Validate v4.1 dataset
        run: python eval/table-discovery/v4.1/scripts/validate_v41.py

      - name: Verify BOK reproduction evaluation tools
        run: |
          python -m pytest -q eval/bok-reproduction/v1/tests
          python eval/bok-reproduction/v1/scripts/evaluate.py validate

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: src/agent/frontend/pnpm-lock.yaml

      - name: Build frontend
        working-directory: src/agent/frontend
        run: |
          pnpm install --frozen-lockfile
          node --test test-*.mjs
          pnpm build

      # CI에는 API 키와 data/tables CSV가 없습니다. 외부 KOSIS·NCP 호출과
      # 347개 CSV 조회는 키와 데이터가 있는 환경에서 별도로 확인합니다.

  windows-npm-install:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/agent/frontend/package-lock.json
      - name: Verify CMD frontend installation path
        working-directory: src/agent/frontend
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node ../../../scripts/windows/check_frontend.cjs . record
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node ../../../scripts/windows/check_frontend.cjs .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $testFiles = Get-ChildItem test-*.mjs | ForEach-Object { $_.FullName }
          node --test $testFiles
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
